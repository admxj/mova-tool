name: Release macOS arm64

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.policy.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: policy
        shell: bash
        run: |
          kind="$(node scripts/release-policy.js "$GITHUB_REF_NAME")"
          printf 'kind=%s\n' "$kind" >> "$GITHUB_OUTPUT"
      - run: node --test test/*.test.js

  desktop:
    needs: classify
    if: needs.classify.outputs.kind == 'desktop'
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: test "$(uname -m)" = arm64
      - run: npm ci
      - name: Build ad-hoc signed macOS app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          TMC_RENDERER_PUBLIC_KEY: ${{ vars.TMC_RENDERER_PUBLIC_KEY }}
        run: |
          node -e 'const fs = require("node:fs"); const key = require("node:crypto").createPublicKey(process.env.TMC_RENDERER_PUBLIC_KEY); if (key.asymmetricKeyType !== "ed25519") process.exit(1); fs.writeFileSync("renderer-update-public.pem", key.export({ type: "spki", format: "pem" }), { flag: "wx" });'
          npm run dist
      - name: Verify release files
        shell: bash
        run: |
          bash scripts/verify-mac-dist.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/*-arm64.dmg
            dist/*-arm64-mac.zip

  renderer:
    needs: classify
    if: needs.classify.outputs.kind == 'renderer'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sign renderer package
        env:
          TMC_RENDERER_SIGNING_KEY: ${{ secrets.TMC_RENDERER_SIGNING_KEY }}
          TMC_RENDERER_PUBLIC_KEY: ${{ vars.TMC_RENDERER_PUBLIC_KEY }}
        run: node scripts/sign-renderer.js "${GITHUB_REF_NAME#v}" release-assets/tmc-renderer.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          if-no-files-found: error
          path: release-assets/tmc-renderer.json

  release:
    needs: [desktop, renderer]
    if: ${{ always() && !cancelled() && (needs.desktop.result == 'success' || needs.renderer.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -f release-assets/tmc-renderer.json ]]; then
            notes='同底座客户端可安装已签名的界面热更新。'
          else
            notes='macOS arm64 DMG 手动安装。未使用 Developer ID 签名或 Apple 公证。'
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --notes "$notes" \
            release-assets/*
